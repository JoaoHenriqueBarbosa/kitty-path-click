name: build

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Build even if nothing changed
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [path-click.patch, ci.sh, .github/workflows/build.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up pacman and tools
        run: ./ci.sh setup

      # GitHub disables scheduled workflows after 60 days without repository
      # activity; re-enabling resets that timer.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/$GH_REPO/actions/workflows/build.yml/enable"

      - name: Check for updates
        id: check
        env:
          FORCE: ${{ inputs.force || false }}
        run: ./ci.sh check

      - name: Build
        if: steps.check.outputs.build == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          PKGREL: ${{ steps.check.outputs.pkgrel }}
          KEY: ${{ steps.check.outputs.key }}
        run: ./ci.sh build

      - name: Publish
        if: steps.check.outputs.build == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          PKGREL: ${{ steps.check.outputs.pkgrel }}
        run: ./ci.sh publish
